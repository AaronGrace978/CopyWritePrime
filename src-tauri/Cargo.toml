[package]
name = "copywriteprime"
version = "0.2.0"
description = "CopyWritePrime — an AI writing studio that stays in the sentence with you."
authors = ["Aaron Grace"]
edition = "2021"

[lib]
name = "copywriteprime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
